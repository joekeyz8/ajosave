services:
  app:
    build: .
    ports:
      - "3000:3000"
    env_file: .env.local
    environment:
      DATABASE_URL: postgresql://ajosave:ajosave@postgres:5432/ajosave
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ajosave
      POSTGRES_PASSWORD: ajosave
      POSTGRES_DB: ajosave
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ajosave"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # High-availability Redis (opt-in): docker compose --profile ha up
  # Then set REDIS_SENTINEL_URL=redis+sentinel://redis-sentinel:26379/mymaster
  redis-replica:
    image: redis:7-alpine
    profiles: [ha]
    command: redis-server --replicaof redis 6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis-sentinel:
    image: redis:7-alpine
    profiles: [ha]
    command: >
      sh -c 'printf "port 26379\nsentinel resolve-hostnames yes\nsentinel monitor mymaster redis 6379 1\nsentinel down-after-milliseconds mymaster 5000\nsentinel failover-timeout mymaster 20000\n" > /tmp/sentinel.conf && redis-sentinel /tmp/sentinel.conf'
    ports:
      - "26379:26379"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

name: Deploy to Staging

on:
  push:
    branches: [main]

permissions:  # least-privilege CI tokens (#108)
  contents: read
  deployments: write   # create GitHub Deployments
  issues: write        # migration-failure alert issue

jobs:
  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      deployment_url: ${{ steps.vercel.outputs.deployment_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: ${{ vars.STAGING_URL }}
          NEXT_PUBLIC_APP_NAME: Ajosave Staging
          NEXTAUTH_URL: ${{ vars.STAGING_URL }}
          NEXTAUTH_SECRET: ${{ secrets.STAGING_NEXTAUTH_SECRET }}
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          STELLAR_NETWORK: testnet
          STELLAR_HORIZON_URL: https://horizon-testnet.stellar.org
          STELLAR_NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
          STELLAR_AJO_CONTRACT_ID: ${{ secrets.STELLAR_TESTNET_CONTRACT_ID }}
          STELLAR_SERVER_SECRET_KEY: ${{ secrets.STELLAR_TESTNET_SECRET_KEY }}
          STELLAR_SOROBAN_RPC_URL: https://soroban-testnet.stellar.org
          USDC_ISSUER: GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5
          USDC_ASSET_CODE: USDC
          PAYSTACK_SECRET_KEY: ${{ secrets.STAGING_PAYSTACK_SECRET_KEY }}
          TERMII_API_KEY: ${{ secrets.STAGING_TERMII_API_KEY }}
          REDIS_URL: ${{ secrets.STAGING_REDIS_URL }}
          CRON_SECRET: ${{ secrets.STAGING_CRON_SECRET }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      - name: Run database migrations
        id: migrations
        run: |
          set -o pipefail
          npm run migrate 2>&1 | tee migration.log
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      - name: Upload migration logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-migration-logs
          path: migration.log
          retention-days: 30
      - name: Alert on migration failure
        if: failure() && steps.migrations.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "🚨 Staging database migration failed",
              body: `A database migration failed in \`${context.workflow}\` (run ${context.runId}).\n\nThe staging deployment was aborted before traffic was shifted.\n\nRun logs: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
      - name: Deploy to Vercel (Preview)
        uses: amondnet/vercel-action@v25
        id: vercel
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: "--prebuilt"
      - name: Verify security headers
        run: |
          set -euo pipefail
          URL="${{ steps.vercel.outputs.deployment_url }}"
          if [ -z "$URL" ]; then URL="${{ vars.STAGING_URL }}"; fi
          echo "Checking security headers on $URL"
          HEADERS=$(curl -sSIL --max-time 60 "$URL")
          echo "$HEADERS"
          echo "$HEADERS" | grep -qi "^strict-transport-security:.*max-age=63072000.*includeSubDomains.*preload" \
            || { echo "::error::Strict-Transport-Security header missing or incomplete"; exit 1; }
          echo "$HEADERS" | grep -qi "^x-content-type-options: *nosniff" \
            || { echo "::error::X-Content-Type-Options: nosniff missing"; exit 1; }
          echo "$HEADERS" | grep -qi "^x-frame-options: *DENY" \
            || { echo "::error::X-Frame-Options: DENY missing"; exit 1; }
          echo "$HEADERS" | grep -qi "^referrer-policy: *strict-origin-when-cross-origin" \
            || { echo "::error::Referrer-Policy missing or unexpected value"; exit 1; }
          echo "$HEADERS" | grep -qi "^permissions-policy:.*camera=().*microphone=().*geolocation=()" \
            || { echo "::error::Permissions-Policy missing or incomplete"; exit 1; }
          echo "All required security headers present."
      - name: Post Staging URL to PR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}
        with:
          script: |
            // Get the latest merged PR
            const { data: commits } = await github.rest.repos.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              per_page: 1
            });
            
            if (commits.length > 0) {
              const commitSha = commits[0].sha;
              const { data: pullRequests } = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'closed',
                sort: 'updated',
                direction: 'desc',
                per_page: 5
              });
              
              const mergedPR = pullRequests.find(pr => 
                pr.merge_commit_sha === commitSha || 
                (pr.merge_commit_sha && pr.merge_commit_sha.startsWith(commitSha.substring(0, 7)))
              );
              
              if (mergedPR) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: mergedPR.number,
                  body: [
                    '## 🚀 Staging Deployment',
                    '',
                    '| Environment | URL |',
                    '|-------------|-----|',
                    `| Staging | ${process.env.STAGING_URL || 'https://staging.ajosave.app'} |`,
                    '',
                    '✅ Staging has been deployed with testnet contract settings.',
                  ].join('\n')
                });
              }
            }

  load-test-staging:
    name: k6 Performance Gate (Staging)
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: grafana/setup-k6-action@v1
      - name: Run k6 load test (50 VUs, p95 < 500 ms, errors < 0.1 %)
        env:
          BASE_URL: ${{ needs.deploy-staging.outputs.deployment_url || vars.STAGING_URL }}
          CRON_SECRET: ${{ secrets.STAGING_CRON_SECRET }}
          CIRCLE_ID: ${{ vars.STAGING_LOAD_TEST_CIRCLE_ID }}
        run: |
          mkdir -p k6-results
          # k6 exits non-zero (99) when a threshold is breached, failing this job
          # and blocking the dependent deploy job below.
          k6 run k6/payout-load-test.js
      - name: Update k6/BENCHMARKS.md with run baseline
        if: always()
        run: |
          [ -f k6-results/summary.json ] || exit 0
          node -e "
            const fs = require('fs');
            const m = JSON.parse(fs.readFileSync('k6-results/summary.json', 'utf8')).metrics || {};
            const p95 = m.http_req_duration?.values?.['p(95)'];
            const err = m.payout_error_rate?.values?.rate;
            const row = '| ' + [new Date().toISOString(), process.env.GITHUB_SHA.slice(0, 7),
              p95 !== undefined ? p95.toFixed(2) : 'N/A',
              err !== undefined ? (err * 100).toFixed(3) : 'N/A',
              m.http_reqs?.values?.count ?? 'N/A'].join(' | ') + ' |\n';
            fs.appendFileSync('k6/BENCHMARKS.md', row);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '### k6 staging run\n| Date | Commit | p95 (ms) | Error rate (%) | Requests |\n|---|---|---|---|---|\n' + row);
          "
      - name: Upload k6 results and updated benchmarks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-staging-results
          path: |
            k6-results/
            k6/BENCHMARKS.md
          retention-days: 90

  deploy-contract-testnet:
    name: Deploy Contract to Testnet
    runs-on: ubuntu-latest
    needs: [deploy-staging, load-test-staging]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with: { targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: contracts }
      - name: Build contract WASM
        working-directory: contracts
        run: cargo build --target wasm32-unknown-unknown --release
      - name: Install Stellar CLI
        run: |
          curl -sSL https://github.com/stellar/stellar-cli/releases/latest/download/stellar-cli-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C /usr/local/bin
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Deploy to testnet
        env:
          STELLAR_NETWORK: testnet
          STELLAR_SERVER_SECRET_KEY: ${{ secrets.STELLAR_TESTNET_SECRET_KEY }}
        run: npm run contract:deploy
      - name: Print contract ID
        run: cat .contract-id
      - name: Verify deployed contract
        env:
          STELLAR_NETWORK: testnet
          STELLAR_SERVER_SECRET_KEY: ${{ secrets.STELLAR_TESTNET_SECRET_KEY }}
        run: npm run contract:verify
      - name: Upload deploy artifacts
        uses: actions/upload-artifact@v4
        with:
          name: contract-deploy-artifacts
          path: deploy-artifacts/
          retention-days: 30
name: Contract Deploy Dry-Run

# Exercises the mainnet deploy path (contracts/ajo/MAINNET_DEPLOY_CHECKLIST.md)
# against testnet so a broken deploy script is caught before release.
# Mark the "Testnet deploy dry-run" check as required in branch protection
# so a deploy failure blocks the merge.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "contracts/**"
      - "scripts/deploy-contract.ts"
      - "scripts/verify-contract.ts"
      - ".github/workflows/contract-deploy-dry-run.yml"

permissions:
  contents: read

concurrency:
  group: contract-deploy-dry-run-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-dry-run:
    name: Testnet deploy dry-run
    runs-on: ubuntu-latest
    # Secrets are unavailable to fork PRs; skip rather than fail there.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    environment: ci-testnet
    env:
      STELLAR_NETWORK: testnet
      # Dedicated, testnet-only CI account (see docs/LEAST_PRIVILEGE_CI_TOKENS.md)
      STELLAR_SERVER_SECRET_KEY: ${{ secrets.CI_TESTNET_DEPLOYER_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts

      - name: Install Stellar CLI
        run: cargo install --locked stellar-cli --version ^22 || cargo install --locked stellar-cli

      - name: Install dependencies
        run: npm ci

      - name: Build contract
        run: npm run contract:build

      - name: Fund CI testnet account
        run: |
          ADDR=$(stellar keys address "$STELLAR_SERVER_SECRET_KEY" 2>/dev/null || node -e "console.log(require('@stellar/stellar-sdk').Keypair.fromSecret(process.env.STELLAR_SERVER_SECRET_KEY).publicKey())")
          curl -sf "https://friendbot.stellar.org/?addr=${ADDR}" > /dev/null || echo "Account already funded"

      - name: Deploy to testnet
        run: |
          npm run contract:deploy | tee deploy.log
          CONTRACT_ID=$(grep -oE 'C[A-Z2-7]{55}' deploy.log | tail -1)
          test -n "$CONTRACT_ID" || { echo "::error::Deploy did not return a contract ID"; exit 1; }
          echo "STELLAR_AJO_CONTRACT_ID=$CONTRACT_ID" >> "$GITHUB_ENV"

      - name: Verify deployment
        run: npm run contract:verify

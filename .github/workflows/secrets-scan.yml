name: Secrets Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: secrets-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:  # least-privilege CI tokens (#108)
  contents: read
  security-events: write   # upload SARIF/secrets reports
  pull-requests: write     # post inline PR comments

jobs:
  gitleaks:
    name: Scan for Secrets with Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: true
        with:
          config: .gitleaks.toml
          verbose: true
          redact: true
          fail: true

      - name: Upload Gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          retention-days: 30

  truffleHog:
    name: Scan for Secrets with TruffleHog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog scan
        uses: trufflesecurity/trufflehog@54c65cdab9424de442c2d4a776d5da3db863d73e # main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --json

      - name: Upload TruffleHog report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trufflehog-report
          path: trufflehog-report.json
          retention-days: 30

  key-signing-policy:
    name: Enforce Key Signing Policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify commit signatures against signing policy
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_REF: ${{ github.event.pull_request.head.sha || github.sha }}
          REQUIRE_SIGNED: "true"
          ALLOWED_SIGNING_KEYS_FILE: .github/allowed-signing-keys.txt
        run: |
          set -euo pipefail

          # Boundary case: no commits to evaluate (e.g. initial push or empty range).
          if [ -z "${BASE_REF:-}" ] || [ "${BASE_REF}" = "0000000000000000000000000000000000000000" ]; then
            echo "::notice::No base ref available; skipping signature verification."
            exit 0
          fi

          commits=$(git rev-list "${BASE_REF}..${HEAD_REF}" 2>/dev/null || true)
          if [ -z "${commits}" ]; then
            echo "::notice::No commits in range ${BASE_REF}..${HEAD_REF}; nothing to verify."
            exit 0
          fi

          # Load the allowlist of trusted signing keys (fingerprints), if present.
          allowed_keys=""
          if [ -f "${ALLOWED_SIGNING_KEYS_FILE}" ]; then
            allowed_keys=$(grep -vE '^\s*(#|$)' "${ALLOWED_SIGNING_KEYS_FILE}" | tr -d '[:space:]' || true)
          fi

          failures=0
          for sha in ${commits}; do
            short=$(git rev-parse --short "${sha}")

            # Validation: commit must carry a valid signature.
            if ! git verify-commit "${sha}" >/dev/null 2>&1; then
              if [ "${REQUIRE_SIGNED}" = "true" ]; then
                echo "::error::Commit ${short} is not signed or has an invalid signature."
                failures=$((failures + 1))
              else
                echo "::warning::Commit ${short} is unsigned (policy not enforced)."
              fi
              continue
            fi

            # Authorization: signer key must be in the trusted allowlist when configured.
            if [ -n "${allowed_keys}" ]; then
              fingerprint=$(git log -1 --format='%GF' "${sha}" | tr -d '[:space:]')
              if [ -z "${fingerprint}" ]; then
                echo "::error::Commit ${short} signature has no resolvable key fingerprint."
                failures=$((failures + 1))
                continue
              fi
              if ! printf '%s\n' "${allowed_keys}" | grep -qx "${fingerprint}"; then
                echo "::error::Commit ${short} signed by untrusted key ${fingerprint}."
                failures=$((failures + 1))
                continue
              fi
            fi

            echo "::notice::Commit ${short} satisfies key signing policy."
          done

          if [ "${failures}" -gt 0 ]; then
            echo "::error::Key signing policy violated by ${failures} commit(s)."
            exit 1
          fi
          echo "::notice::All commits satisfy key signing policy."

      - name: Retry signature verification on transient failure
        if: failure()
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # Retry once to tolerate transient key-server/network failures.
          if [ -z "${BASE_REF:-}" ] || [ "${BASE_REF}" = "0000000000000000000000000000000000000000" ]; then
            exit 0
          fi
          commits=$(git rev-list "${BASE_REF}..${HEAD_REF}" 2>/dev/null || true)
          for sha in ${commits}; do
            git verify-commit "${sha}" >/dev/null 2>&1 || {
              echo "::error::Retry failed: commit $(git rev-parse --short "${sha}") still fails signature verification."
              exit 1
            }
          done
          echo "::notice::Retry succeeded; signatures verified."

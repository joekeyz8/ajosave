name: Security Audit

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1" # Weekly on Monday at 03:00 UTC

permissions:
  contents: read
  security-events: write   # required to upload SARIF results
  pull-requests: write     # required to post PR comments

jobs:
  codeql:
    name: CodeQL Analysis (JavaScript/TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: codeql-js

  npm-audit:
    name: npm Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }

      - run: npm ci

      - name: Run npm audit
        id: npm_audit
        run: |
          npm audit --audit-level=high --json > npm-audit.json || true
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Post npm audit results as PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const audit = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8'));
            const { vulnerabilities = {} } = audit;
            const counts = Object.values(vulnerabilities).reduce((acc, v) => {
              acc[v.severity] = (acc[v.severity] || 0) + 1;
              return acc;
            }, {});
            const total = Object.values(counts).reduce((a, b) => a + b, 0);
            const summary = total === 0
              ? '✅ No npm vulnerabilities found.'
              : `⚠️ **${total} npm vulnerabilities** — ${JSON.stringify(counts)}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `### npm Audit\n${summary}`,
            });

  container-scan:
    name: Container Image Vulnerability Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build container image
        run: docker build -t ajosave:${{ github.sha }} .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "ajosave:${{ github.sha }}"
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "0"

      - name: Upload Trivy scan results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy-results.sarif"
          category: trivy-container

  cargo-audit:
    name: Cargo Security Audit (Rust contracts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: Swatinem/rust-cache@v2
        with: { workspaces: contracts }

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        id: cargo_audit
        working-directory: contracts
        run: |
          cargo audit --json > ../cargo-audit.json || true

      - name: Post cargo audit results as PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '### Cargo Audit\n';
            try {
              const audit = JSON.parse(fs.readFileSync('cargo-audit.json', 'utf8'));
              const vulns = audit.vulnerabilities?.list ?? [];
              body += vulns.length === 0
                ? '✅ No Rust vulnerabilities found.'
                : `⚠️ **${vulns.length} Rust vulnerabilities found:**\n` +
                  vulns.map(v =>
                    `- **${v.advisory.id}** (${v.advisory.severity}): ${v.advisory.title} — \`${v.package.name} ${v.package.version}\``
                  ).join('\n');
            } catch {
              body += '⚠️ Could not parse cargo audit output.';
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

  key-signing-policy:
    name: Key Signing Policy (commit & tag signatures)
    runs-on: ubuntu-latest
    # Enforce on PRs and pushes; scheduled runs are advisory only.
    continue-on-error: ${{ github.event_name == 'schedule' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate signing policy configuration
        id: policy
        env:
          # Optional allowlist of trusted signing key fingerprints (comma-separated).
          TRUSTED_SIGNING_KEYS: ${{ vars.TRUSTED_SIGNING_KEYS }}
          # Require signatures on all commits (true) or only on merge/tag commits (false).
          REQUIRE_ALL_COMMITS: ${{ vars.REQUIRE_ALL_COMMITS || 'false' }}
        run: |
          set -euo pipefail

          # Boundary: empty allowlist means we cannot verify signer identity.
          if [ -z "${TRUSTED_SIGNING_KEYS:-}" ]; then
            echo "::warning::TRUSTED_SIGNING_KEYS is not configured; signer identity cannot be verified."
            echo "enforce=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Normalize allowlist into a lookup file (uppercase, trimmed).
          echo "${TRUSTED_SIGNING_KEYS}" | tr ',' '\n' | tr -d ' ' | tr '[:lower:]' '[:upper:]' | sed '/^$/d' > trusted-keys.txt
          if [ ! -s trusted-keys.txt ]; then
            echo "::error::TRUSTED_SIGNING_KEYS is set but contains no valid fingerprints."
            exit 1
          fi

          echo "enforce=true" >> "$GITHUB_OUTPUT"
          echo "require_all=${REQUIRE_ALL_COMMITS}" >> "$GITHUB_OUTPUT"

      - name: Verify commit signatures
        if: steps.policy.outputs.enforce == 'true'
        env:
          REQUIRE_ALL_COMMITS: ${{ steps.policy.outputs.require_all }}
        run: |
          set -euo pipefail

          # Determine the commit range to verify.
          if [ "${{ github.event_name }}" = 'pull_request' ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
            RANGE="${BASE}..${HEAD}"
          elif [ "${{ github.event_name }}" = 'push' ] && [ "${{ github.event.before }}" != '0000000000000000000000000000000000000000' ]; then
            RANGE="${{ github.event.before }}..${{ github.sha }}"
          else
            # Scheduled / first push: verify the latest commit only.
            RANGE="-1 HEAD"
          fi

          echo "Verifying commit range: ${RANGE}"

          # Collect commits in range (handle single-commit fallback).
          if [ "${RANGE}" = "-1 HEAD" ]; then
            COMMITS=$(git rev-list -1 HEAD)
          else
            COMMITS=$(git rev-list "${RANGE}")
          fi

          if [ -z "${COMMITS}" ]; then
            echo "No commits to verify in range."
            exit 0
          fi

          FAILED=0
          for sha in ${COMMITS}; do
            # Skip merge commits unless all commits are required.
            PARENTS=$(git rev-list --parents -n 1 "${sha}" | wc -w)
            if [ "${PARENTS}" -gt 2 ] && [ "${REQUIRE_ALL_COMMITS}" != 'true' ]; then
              echo "::notice::Skipping merge commit ${sha} (REQUIRE_ALL_COMMITS=false)."
              continue
            fi

            # Retry signature verification to tolerate transient gpg/network issues.
            VERIFIED=0
            for attempt in 1 2 3; do
              if git verify-commit "${sha}" >/dev/null 2>&1; then
                VERIFIED=1
                break
              fi
              echo "::warning::Signature verification attempt ${attempt} failed for ${sha}; retrying..."
              sleep $((attempt * 2))
            done

            if [ "${VERIFIED}" -ne 1 ]; then
              echo "::error::Commit ${sha} is not signed or signature is invalid."
              FAILED=1
              continue
            fi

            # Authorization: verify signer fingerprint is in the trusted allowlist.
            FPR=$(git log -1 --format='%GK' "${sha}" | tr '[:lower:]' '[:upper:]')
            if [ -z "${FPR}" ] || ! grep -qx "${FPR}" trusted-keys.txt; then
              echo "::error::Commit ${sha} signed by untrusted key '${FPR:-unknown}'."
              FAILED=1
              continue
            fi

            echo "✅ Commit ${sha} signed by trusted key ${FPR}."
          done

          if [ "${FAILED}" -ne 0 ]; then
            echo "::error::Key signing policy violated. See runbook: docs/security/key-signing-policy.md"
            exit 1
          fi

          echo "✅ Key signing policy satisfied."

      - name: Verify tag signatures
        if: steps.policy.outputs.enforce == 'true' && startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          if ! git verify-tag "${TAG}" >/dev/null 2>&1; then
            echo "::error::Tag ${TAG} is not signed or signature is invalid."
            exit 1
          fi
          FPR=$(git tag -v "${TAG}" 2>&1 | grep -oE '[A-F0-9]{40}' | head -n1 || true)
          if [ -z "${FPR}" ] || ! grep -qx "${FPR}" trusted-keys.txt; then
            echo "::error::Tag ${TAG} signed by untrusted key '${FPR:-unknown}'."
            exit 1
          fi
          echo "✅ Tag ${TAG} signed by trusted key ${FPR}."

      - name: Upload signing policy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: key-signing-policy-report
          path: trusted-keys.txt
          if-no-files-found: ignore
          retention-days: 30
